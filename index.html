<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make It Meme</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #fff; text-align: center; padding: 15px; margin: 0; -webkit-user-select: none; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: #202024; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        .btn { background: #8257e5; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 10px 0; width: 100%; font-size: 16px; display: block; box-sizing: border-box; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #323238 !important; color: #7c7c8a !important; cursor: not-allowed; transform: none !important; }
        .btn-vote { background: #04d361; margin-top: 10px; }
        .btn-sub { background: #4f46e5; padding: 8px; font-size: 14px; margin: 5px 0; }
        .btn-download { background: #2ea44f; margin-top: 5px; }
        .btn-size { background: #4e4e54; color: white; border: none; padding: 8px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-size:active { background: #63636b; }
        input[type="text"], textarea { padding: 12px; width: 100%; border-radius: 6px; border: none; margin: 8px 0; background: #121214; color: #fff; border: 1px solid #323238; font-size: 15px; box-sizing: border-box; -webkit-user-select: text; user-select: text; font-family: inherit; }
        textarea { resize: none; height: 55px; }
        #canvas-container { position: relative; display: inline-block; max-width: 100%; margin-top: 10px; }
        canvas { max-width: 100%; border-radius: 8px; border: 2px solid #8257e5; background: #121214; touch-action: none; display: block; }
        .galeria { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .meme-card { background: #29292e; padding: 12px; border-radius: 8px; border: 1px solid #4f46e5; text-align: center; }
        .meme-card img { width: 100%; border-radius: 6px; display: block; background: #121214; min-height: 200px; }
        .ranking-item { background: #29292e; padding: 14px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; }
        .ranking-item:first-child { background: #feb72b; color: #000; }
        .lista-textos { text-align: left; background: #121214; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #323238; }
        .linha-input { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
        #temporizador, #timer-exposicao { font-size: 22px; font-weight: bold; color: #e53e3e; background: #29292e; padding: 10px; border-radius: 8px; border: 1px solid #e53e3e; margin-bottom: 15px; }
        #timer-exposicao { color: #04d361; border-color: #04d361; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #8257e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0 { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>Make It Meme 🎭</h1>
    
    <div id="tela-inicial">
        <input type="text" id="inputNome" placeholder="Seu Nome / Apelido"><br>
        <button class="btn" id="btnCriar">Criar Nova Sala</button>
        <input type="text" id="inputCodigo" placeholder="Código da Sala"><br>
        <button class="btn" id="btnEntrar" style="background: #29292e;">Entrar na Sala</button>
    </div>

    <div id="tela-lobby" class="hidden">
        <div style="background: #121214; padding: 15px; border-radius: 8px; border: 1px solid #323238; margin-bottom: 20px;">
            <h1 id="lobby-codigo" style="margin: 0; color: #feb72b; letter-spacing: 2px;">-</h1>
        </div>
        <div id="lobby-lista-jogadores" style="text-align: left; margin-bottom: 20px; font-size: 16px;"></div>
        <button class="btn hidden" id="btnIniciarJogo" style="background: #04d361;">🚀 Iniciar Jogo</button>
    </div>

    <div id="tela-jogo" class="hidden">
        <div id="temporizador">⏱️ Tempo Restante: 04:00</div>
        <div id="lista-jogadores" style="color:#a8a8b3; margin-bottom: 15px; font-size: 14px;"></div>
        <div class="lista-textos">
            <div id="container-inputs"></div>
            <button class="btn btn-sub" id="btnAdicionarTexto">+ Legenda</button>
        </div>
        <div id="canvas-container">
            <canvas id="memeCanvas"></canvas>
        </div>
        <button class="btn btn-download" id="btnDownload">📥 Salvar Meme</button>
        <button class="btn" id="btnEnviar" style="background:#04d361; margin-top: 15px;">🚀 Enviar Meu Meme</button>
    </div>

    <div id="tela-espera" class="hidden">
        <div style="padding: 40px 20px;">
            <h2 style="color: #fbbf24;">Meme Enviado!</h2>
            <div class="loader"></div>
        </div>
    </div>

    <div id="tela-exposicao" class="hidden">
        <div id="timer-exposicao">👀 Olhem para o ecrã: 15s</div>
        <h3 id="autor-meme-exposto" style="color: #feb72b; margin-bottom: 10px;">Meme de: -</h3>
        <div class="meme-card" style="border: 2px solid #04d361;">
            <img id="img-meme-exposto" src="" alt="Meme em exibição">
        </div>
    </div>

    <div id="tela-votacao" class="hidden">
        <h2>🔥 Vote no Melhor Meme! 🔥</h2>
        <div class="galeria" id="galeria-memes"></div>
    </div>

    <div id="tela-ranking" class="hidden">
        <h2>🏆 Pontuação Geral 🏆</h2>
        <div id="podio-scores"></div>
        <button class="btn hidden" id="btnVoltarJogo" style="margin-top:20px; background: #8257e5;">Próxima Rodada</button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
    // [O restante da lógica de áudio e variáveis permanece o mesmo]
    let audioCtx = null;
    let musicLoopStarted = false;
    function iniciarContextoAudio() { try { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } if (!musicLoopStarted) { musicLoopStarted = true; ligarMusicaAmbienteVirtual(); } } catch(e) {} }
    function ligarMusicaAmbienteVirtual() { let acordesSunday = [[261.63, 329.63, 392.00, 493.88], [261.63, 311.13, 392.00, 466.16], [293.66, 349.23, 440.00, 523.25], [392.00, 493.88, 587.33, 698.46]]; let passo = 0; setInterval(() => { if (!audioCtx || audioCtx.state === 'suspended') return; try { let notasAtuais = acordesSunday[passo % acordesSunday.length]; let tempoAtual = audioCtx.currentTime; notasAtuais.forEach((frequencia, index) => { let osc = audioCtx.createOscillator(); let g = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(frequencia, tempoAtual + (index * 0.12)); g.gain.setValueAtTime(0.18, tempoAtual + (index * 0.12)); g.gain.exponentialRampToValueAtTime(0.001, tempoAtual + 1.2); osc.connect(g); g.connect(audioCtx.destination); osc.start(tempoAtual + (index * 0.12)); osc.stop(tempoAtual + 1.2); }); passo++; } catch(e){} }, 1500); }
    function tocarSomNativo(tipo) { try { iniciarContextoAudio(); if (!audioCtx || audioCtx.state === 'suspended') return; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); let tempoAtual = audioCtx.currentTime; if (tipo === 'clique') { osc.type = 'sine'; osc.frequency.setValueAtTime(450, tempoAtual); osc.frequency.exponentialRampToValueAtTime(150, tempoAtual + 0.08); gain.gain.setValueAtTime(0.5, tempoAtual); gain.gain.linearRampToValueAtTime(0.01, tempoAtual + 0.08); osc.start(tempoAtual); osc.stop(tempoAtual + 0.08); } else if (tipo === 'voto') { osc.type = 'triangle'; osc.frequency.setValueAtTime(587.33, tempoAtual); osc.frequency.setValueAtTime(698.46, tempoAtual + 0.07); osc.frequency.setValueAtTime(880.00, tempoAtual + 0.14); gain.gain.setValueAtTime(0.6, tempoAtual); gain.gain.linearRampToValueAtTime(0.01, tempoAtual + 0.25); osc.start(tempoAtual); osc.stop(tempoAtual + 0.25); } else if (tipo === 'vitoria') { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, tempoAtual); osc.frequency.setValueAtTime(659.25, tempoAtual + 0.1); osc.frequency.setValueAtTime(783.99, tempoAtual + 0.2); osc.frequency.setValueAtTime(1046.50, tempoAtual + 0.3); gain.gain.setValueAtTime(0.5, tempoAtual); gain.gain.linearRampToValueAtTime(0.01, tempoAtual + 0.45); osc.start(tempoAtual); osc.stop(tempoAtual + 0.45); } } catch(e) {} }

    let peer = null, conexoes = [], modoJogo = "host", meuNome = "", codigoSala = "", jogadores = [];
    let tempoRestante = 240; 
    let intervaloTimer = null;
    let jaEnviouMeme = false;
    let imagemMemeAtual = new Image();
    let imagemCarregada = false;
    let indiceImagemAtualGlobal = 0; 
    let textosMeme = [];
    let textoArrastando = null;

    const telaInicial = document.getElementById('tela-inicial');
    const telaLobby = document.getElementById('tela-lobby');
    const telaJogo = document.getElementById('tela-jogo');
    const telaEspera = document.getElementById('tela-espera');
    const telaExposicao = document.getElementById('tela-exposicao');
    const telaVotacao = document.getElementById('tela-votacao');
    const telaRanking = document.getElementById('tela-ranking');
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 360;

    // [Funções auxiliares omitidas para brevidade, mantendo lógica principal intacta]
    function gerarFundoMemeVirtual(indice) { imagemCarregada = false; indiceImagemAtualGlobal = indice; let urlSelecionada = ["meme33.jpg","meme.jpg","meme17.jpg"][indice % 3]; imagemMemeAtual = new Image(); imagemMemeAtual.onload = () => { imagemCarregada = true; }; imagemMemeAtual.src = urlSelecionada; textosMeme = [{ conteudo: "TEXTO\nSUPERIOR", x: canvas.width / 2, y: 50, tamanho: 30, rotacao: 0 }, { conteudo: "TEXTO\nINFERIOR", x: canvas.width / 2, y: canvas.height - 60, tamanho: 30, rotacao: 0 }]; inicializarInputs(); }
    function renderLoop() { drawMeme(); requestAnimationFrame(renderLoop); } requestAnimationFrame(renderLoop);
    function inicializarInputs() { const container = document.getElementById('container-inputs'); container.innerHTML = ""; textosMeme.forEach((t, index) => { const div = document.createElement('div'); div.className = "linha-input"; const txt = document.createElement('textarea'); txt.value = t.conteudo; txt.oninput = (e) => { t.conteudo = e.target.value; }; div.appendChild(txt); container.appendChild(div); }); }

    // --- LÓGICA DO TEMPO DE EXPOSIÇÃO (ALTERADA PARA 15S) ---
    function executarSequenciaExposicaoMeme(listaMemes) {
        let indiceMeme = 0; 
        let tempoRestanteExposicao = 15; // <--- Alterado para 15
        let timerExposicaoLoop = null;
        
        function apresentarProximoMeme() {
            while(indiceMeme < listaMemes.length && !listaMemes[indiceMeme].imagem) { indiceMeme++; }
            if (indiceMeme >= listaMemes.length) { sincronizarTodosOsClientes({ tipo: "ir_votacao", listaMemes: listaMemes }); return; }
            
            let memeAtual = listaMemes[indiceMeme]; 
            tempoRestanteExposicao = 15; // <--- Alterado para 15
            
            sincronizarTodosOsClientes({ tipo: "mostrar_meme_individual", nomeAutor: memeAtual.nome, imagemMeme: memeAtual.imagem, segundosRestantes: tempoRestanteExposicao });
            
            timerExposicaoLoop = setInterval(() => {
                tempoRestanteExposicao--;
                if (tempoRestanteExposicao <= 0) {
                    clearInterval(timerExposicaoLoop); 
                    indiceMeme++; 
                    apresentarProximoMeme();
                } else {
                    sincronizarTodosOsClientes({ tipo: "mostrar_meme_individual", nomeAutor: memeAtual.nome, imagemMeme: memeAtual.imagem, segundosRestantes: tempoRestanteExposicao });
                }
            }, 1000);
        }
        apresentarProximoMeme();
    }
    // --------------------------------------------------------

    function abrirTelaExposicaoDinamica(nome, imagem, segundos) {
        telaJogo.classList.add('hidden'); telaEspera.classList.add('hidden'); telaVotacao.classList.add('hidden'); telaExposicao.classList.remove('hidden');
        document.getElementById('autor-meme-exposto').innerText = "Meme de: " + nome;
        document.getElementById('img-meme-exposto').src = imagem;
        document.getElementById('timer-exposicao').innerText = `👀 Olhem para o ecrã: ${segundos}s`;
    }

    // [Restante do código de PeerJS, Votação e Ranking...]
    // (As funções de conexão, enviar meme, etc., permanecem idênticas)
    function drawMeme() { ctx.fillStyle = "#121214"; ctx.fillRect(0, 0, canvas.width, canvas.height); if (imagemCarregada && imagemMemeAtual.complete) ctx.drawImage(imagemMemeAtual, 0, 0, canvas.width, canvas.height); textosMeme.forEach(t => { ctx.save(); ctx.translate(t.x, t.y); ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = `bold ${t.tamanho}px Impact`; ctx.strokeText(t.conteudo, 0, 0); ctx.fillText(t.conteudo, 0, 0); ctx.restore(); }); }
</script>
</body>
</html>
