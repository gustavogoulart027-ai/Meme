<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make It Meme - Versão Final</title>
    <style>
        body { background: #121214; color: #fff; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; }
        .hidden { display: none !important; }
        .btn { background: #8257e5; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; margin: 8px 0; font-weight: bold; }
        canvas { max-width: 100%; border: 2px solid #8257e5; border-radius: 8px; background: #000; display: block; margin: 10px auto; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #333; background: #202024; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>Make It Meme 🎭</h1>
    
    <div id="tela-inicial">
        <input type="text" id="inputNome" placeholder="Seu Nome">
        <button class="btn" onclick="iniciarSala(true)">Criar Nova Sala</button>
        <input type="text" id="inputCodigo" placeholder="Código da Sala">
        <button class="btn" style="background: #323238;" onclick="iniciarSala(false)">Entrar na Sala</button>
    </div>

    <div id="tela-jogo" class="hidden">
        <canvas id="memeCanvas" width="400" height="360"></canvas>
        <textarea id="textoEdit" oninput="atualizarTexto(this.value)" placeholder="Digite a legenda..."></textarea>
        <div style="display: flex; gap: 5px;">
            <button class="btn" onclick="ajustar(5, 0)">Tamanho +</button>
            <button class="btn" onclick="ajustar(0, 15)">Girar +</button>
        </div>
        <button class="btn" style="background:#04d361" onclick="finalizar()">Enviar Meme</button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    let imgMeme = new Image();
    let textos = [{ conteudo: "LEGENDA", x: 200, y: 180, tam: 30, rot: 0 }];
    const memes = ["meme1.jpg", "meme2.jpg", "meme3.jpg", "meme4.jpg", "meme5.jpg"];
    let fila = [];

    // Loop de renderização contínua (Corrige o sumiço dos elementos)
    function loop() {
        ctx.fillStyle = "#121214"; ctx.fillRect(0, 0, 400, 360);
        if(imgMeme.complete) ctx.drawImage(imgMeme, 0, 0, 400, 360);
        
        textos.forEach(t => {
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.rot * Math.PI / 180);
            ctx.font = `bold ${t.tam}px Impact`;
            ctx.fillStyle = 'white'; ctx.strokeStyle = 'black'; ctx.lineWidth = 4;
            ctx.textAlign = 'center';
            ctx.strokeText(t.conteudo, 0, 0);
            ctx.fillText(t.conteudo, 0, 0);
            ctx.restore();
        });
        requestAnimationFrame(loop);
    }
    loop();

    function atualizarTexto(val) { textos[0].conteudo = val; }
    function ajustar(t, r) { textos[0].tam += t; textos[0].rot += r; }

    function iniciarSala(criar) {
        const id = criar ? "MIM-" + Math.random().toString(36).substring(2,7).toUpperCase() : document.getElementById('inputCodigo').value;
        const peer = new Peer(criar ? id : undefined);
        
        peer.on('open', () => {
            if(criar) {
                fila = [...Array(memes.length).keys()].sort(() => Math.random() - 0.5);
                imgMeme.src = memes[fila.shift()];
                alert("Código da sala: " + id);
            } else {
                peer.connect(id);
            }
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-jogo').classList.remove('hidden');
        });
    }

    function finalizar() { alert("Meme enviado com sucesso!"); }
</script>
</body>
</html>
