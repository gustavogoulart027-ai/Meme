<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make It Meme - Custom Online Mobile</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #fff; text-align: center; padding: 15px; margin: 0; -webkit-user-select: none; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: #202024; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        .btn { background: #8257e5; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 10px 0; width: 100%; font-size: 16px; display: block; box-sizing: border-box; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-vote { background: #04d361; margin-top: 10px; }
        .btn-sub { background: #4f46e5; padding: 8px; font-size: 14px; margin: 5px 0; }
        .btn-download { background: #2ea44f; margin-top: 5px; }
        input[type="text"] { padding: 14px; width: 100%; border-radius: 6px; border: none; margin: 8px 0; background: #121214; color: #fff; border: 1px solid #323238; font-size: 16px; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
        #canvas-container { position: relative; display: inline-block; max-width: 100%; margin-top: 10px; }
        canvas { max-width: 100%; border-radius: 8px; border: 2px solid #8257e5; background: #121214; touch-action: none; }
        .galeria { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .meme-card { background: #29292e; padding: 12px; border-radius: 8px; border: 1px solid #4f46e5; text-align: center; }
        .meme-card img { width: 100%; border-radius: 6px; }
        .ranking-item { background: #29292e; padding: 14px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; }
        .ranking-item:first-child { background: #feb72b; color: #000; }
        #status-envio { color: #fbbf24; font-weight: bold; margin-top: 10px; }
        .lista-textos { text-align: left; background: #121214; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #323238; }
        #temporizador { font-size: 22px; font-weight: bold; color: #e53e3e; background: #29292e; padding: 10px; border-radius: 8px; border: 1px solid #e53e3e; margin-bottom: 15px; }
        .audio-controls { margin-bottom: 15px; background: #29292e; padding: 8px; border-radius: 6px; font-size: 12px; color: #a8a8b3; }
    </style>
</head>
<body>
<div class="container">
    <h1>Make It Meme 🎭</h1>

    <div class="audio-controls">
        🎵 Música de fundo relaxante ativa automaticamente ao jogar.
    </div>
    
    <div id="tela-inicial">
        <input type="text" id="inputNome" placeholder="Seu Nome / Apelido"><br>
        <button class="btn" id="btnCriar">Criar Nova Sala</button>
        <p style="color: #7c7c8a; margin: 5px 0;">ou</p>
        <input type="text" id="inputCodigo" placeholder="Código da Sala para Entrar"><br>
        <button class="btn" id="btnEntrar" style="background: #29292e;">Entrar na Sala</button>
    </div>

    <div id="tela-lobby" class="hidden">
        <h2 style="color: #8257e5;">Lobby da Sala</h2>
        <div style="background: #121214; padding: 15px; border-radius: 8px; border: 1px solid #323238; margin-bottom: 20px;">
            <p style="margin: 5px 0; font-size: 14px; color: #a8a8b3;">Código da sala:</p>
            <h1 id="lobby-codigo" style="margin: 5px 0; color: #feb72b; letter-spacing: 2px;">-</h1>
        </div>
        <div id="lobby-lista-jogadores" style="text-align: left; margin-bottom: 20px; font-size: 16px;"></div>
        <button class="btn hidden" id="btnIniciarJogo" style="background: #04d361;">🚀 Iniciar Jogo (Play)</button>
        <p id="lobby-msg-cliente" style="color: #7c7c8a; font-style: italic;"></p>
    </div>

    <div id="tela-jogo" class="hidden">
        <h3 id="info-sala" style="color: #8257e5;">Sala: -</h3>
        
        <div id="temporizador">⏱️ Tempo Restante: 02:00</div>
        
        <div id="lista-jogadores" style="color:#a8a8b3; margin-bottom: 15px; font-size: 14px;"></div>

        <div class="lista-textos">
            <span style="font-size: 14px; color:#a8a8b3;">Toque e arraste as frases diretamente na imagem!</span>
            <div id="container-inputs"></div>
            <button class="btn btn-sub" id="btnAdicionarTexto">+ Adicionar Nova Legenda</button>
        </div>
        
        <div id="canvas-container">
            <canvas id="memeCanvas"></canvas>
        </div>
        
        <button class="btn btn-download" id="btnDownload">📥 Descarregar Este Meme (Galeria)</button>
        <button class="btn" id="btnEnviar" style="background:#04d361; margin-top: 15px;">🚀 Enviar Meu Meme Para a Sala</button>
        <p id="status-envio"></p>
    </div>

    <div id="tela-votacao" class="hidden">
        <h2>🔥 Vote no Melhor Meme! 🔥</h2>
        <div class="galeria" id="galeria-memes"></div>
    </div>

    <div id="tela-ranking" class="hidden">
        <h2>🏆 Pontuação Geral 🏆</h2>
        <div id="podio-scores"></div>
        <button class="btn" id="btnVoltarJogo" style="margin-top:20px; background: #8257e5;">Próxima Rodada</button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
    // Inicialização dos Áudios usando links diretos públicos estáveis
    const sfxClique = new Audio("https://actions.google.com/sounds/v1/ui/click_on.ogg");
    const sfxVoto = new Audio("https://actions.google.com/sounds/v1/wishes/star_burst.ogg");
    const sfxVitoria = new Audio("https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg");
    
    // Música ambiente relaxante (Loop)
    const bgmRelaxante = new Audio("https://assets.mixkit.co/music/preview/mixkit-games-world-loop-464.mp3");
    bgmRelaxante.loop = true;
    bgmRelaxante.volume = 0.3; // Volume mais baixo para não atrapalhar

    function tocarSom(som) {
        som.currentTime = 0;
        som.play().catch(e => console.log("Áudio bloqueado pelo navegador até a primeira interação."));
    }

    function ligarMusica() {
        if (bgmRelaxante.paused) {
            bgmRelaxante.play().catch(e => console.log("Aguardando clique para iniciar música."));
        }
    }

    let peer = null, conexoes = [], modoJogo = "host", meuNome = "", codigoSala = "", jogadores = [];
    let currentImage = new Image();
    let tempoRestante = 120; 
    let intervaloTimer = null;
    let jaEnviouMeme = false;

    // CORREÇÃO: Links reais de imagens de memes famosos da internet para evitar telas pretas
    const bancoImagensMemes = [
        "https://i.imgur.com/vHca9sF.jpeg", // Drake
        "https://i.imgur.com/HgbeY8G.jpeg", // Distracted Boyfriend
        "https://i.imgur.com/6U8cg06.jpeg", // Change my mind
        "https://i.imgur.com/KdfSgOn.jpeg", // Success Kid
        "https://i.imgur.com/9nFfSpt.jpeg", // Disaster Girl
        "https://i.imgur.com/6zqby9X.jpeg", // Spider-man pointing
        "https://i.imgur.com/O6SgH2S.jpeg", // Woman yelling at cat
        "https://i.imgur.com/QCunbEs.jpeg", // Expanding Brain
        "https://i.imgur.com/f0IeW8n.jpeg", // Two Buttons
        "https://i.imgur.com/mC210C8.jpeg"  // Mocking Spongebob
    ];
    let indiceImagemAtual = 0;
    let imagensDisponiveisRodada = [];
    
    let textosMeme = [
        { conteudo: "TEXTO SUPERIOR", x: 200, y: 40 },
        { conteudo: "TEXTO INFERIOR", x: 200, y: 260 }
    ];
    let textoArrastando = null;

    const telaInicial = document.getElementById('tela-inicial');
    const telaLobby = document.getElementById('tela-lobby');
    const telaJogo = document.getElementById('tela-jogo');
    const telaVotacao = document.getElementById('tela-votacao');
    const telaRanking = document.getElementById('tela-ranking');
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');

    // Adiciona efeito de som a todos os botões padrão ao clicar
    document.querySelectorAll('.btn').forEach(botao => {
        botao.addEventListener('click', () => { tocarSom(sfxClique); ligarMusica(); });
    });

    function configurarNovaImagem(indice) {
        if(indice >= bancoImagensMemes.length || indice < 0) indice = 0;
        indiceImagemAtual = indice;
        currentImage = new Image();
        currentImage.crossOrigin = "anonymous";
        currentImage.src = bancoImagensMemes[indiceImagemAtual];
        
        currentImage.onload = () => { 
            textosMeme[0].x = currentImage.width / 2; textosMeme[0].y = 40;
            textosMeme[1].x = currentImage.width / 2; textosMeme[1].y = currentImage.height - 40;
            drawMeme(); 
            inicializarInputs(); 
        };
        currentImage.onerror = () => {
            canvas.width = 400; canvas.height = 300;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#29292e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff"; ctx.font = "16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("Erro ao carregar imagem externa", 200, 140);
            inicializarInputs();
        };
    }

    function prepararSacoDeImagens() {
        imagensDisponiveisRodada = [...Array(bancoImagensMemes.length).keys()];
        for (let i = imagensDisponiveisRodada.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [imagensDisponiveisRodada[i], imagensDisponiveisRodada[j]] = [imagensDisponiveisRodada[j], imagensDisponiveisRodada[i]];
        }
    }

    function iniciarTemporizador() {
        clearInterval(intervaloTimer);
        tempoRestante = 120; jaEnviouMeme = false;
        document.getElementById('temporizador').style.color = "#fff";
        intervaloTimer = setInterval(() => {
            tempoRestante--;
            let minutos = Math.floor(tempoRestante / 60);
            let segundos = tempoRestante % 60;
            document.getElementById('temporizador').innerText = `⏱️ Tempo Restante: ${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            if (tempoRestante <= 15) document.getElementById('temporizador').style.color = "#e53e3e";
            if (tempoRestante <= 0) { clearInterval(intervaloTimer); if (!jaEnviouMeme) enviarMemeForçado(); }
        }, 1000);
    }

    function inicializarInputs() {
        const container = document.getElementById('container-inputs');
        container.innerHTML = "";
        textosMeme.forEach((t, index) => {
            const div = document.createElement('div'); div.style.display = "flex"; div.style.gap = "5px";
            const input = document.createElement('input'); input.type = "text"; input.value = t.conteudo;
            input.oninput = (e) => { t.conteudo = e.target.value; drawMeme(); };
            const btnApagar = document.createElement('button'); btnApagar.innerText = "X";
            btnApagar.style.background = "#e53e3e"; btnApagar.style.color = "white"; btnApagar.style.border = "none"; btnApagar.style.padding = "10px"; btnApagar.style.margin = "4px 0"; btnApagar.style.borderRadius = "6px";
            btnApagar.onclick = () => { tocarSom(sfxClique); textosMeme.splice(index, 1); inicializarInputs(); drawMeme(); };
            div.appendChild(input); if(textosMeme.length > 1) div.appendChild(btnApagar); container.appendChild(div);
        });
    }

    document.getElementById('btnAdicionarTexto').onclick = () => {
        tocarSom(sfxClique);
        textosMeme.push({ conteudo: "NOVA LEGENDA", x: canvas.width / 2, y: canvas.height / 2 });
        inicializarInputs(); drawMeme();
    };

    function obtenerPosicao(e) {
        const rect = canvas.getBoundingClientRect();
        const clienteX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clienteY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        if (clienteX === undefined || clienteY === undefined) return {x: 0, y: 0};
        return { x: ((clienteX - rect.left) / rect.width) * canvas.width, y: ((clienteY - rect.top) / rect.height) * canvas.height };
    }

    function iniciarArrasto(e) {
        const pos = obterPosicao(e);
        textoArrastando = textosMeme.find(t => Math.sqrt(Math.pow(pos.x - t.x, 2) + Math.pow(pos.y - t.y, 2)) < 40);
    }

    function movendoArrasto(e) {
        if (!textoArrastando) return;
        if(e.cancelable) e.preventDefault();
        const pos = obterPosicao(e);
        if (pos.x === 0 && pos.y === 0) return;
        textoArrastando.x = pos.x; textoArrastando.y = pos.y; drawMeme();
    }

    canvas.addEventListener('mousedown', iniciarArrasto);
    canvas.addEventListener('mousemove', movendoArrasto);
    window.addEventListener('mouseup', () => textoArrastando = null);
    canvas.addEventListener('touchstart', iniciarArrasto, { passive: false });
    canvas.addEventListener('touchmove', movendoArrasto, { passive: false });
    window.addEventListener('touchend', () => textoArrastando = null);

    document.getElementById('btnDownload').onclick = () => {
        tocarSom(sfxClique);
        const link = document.createElement('a');
        link.download = 'meu-meme-' + Math.floor(Math.random() * 10000) + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.9); link.click();
    };

    document.getElementById('btnCriar').onclick = () => {
        tocarSom(sfxClique); ligarMusica();
        meuNome = document.getElementById('inputNome').value.trim().replace(/['"]/g, '');
        if(!meuNome) return alert("Digite seu nome!");
        codigoSala = "MIM-" + Math.random().toString(36).substring(2, 7).toUpperCase();
        modoJogo = "host";
        peer = new Peer(codigoSala);
        peer.on('open', () => {
            jogadores = [{ id: peer.id, nome: meuNome, pontos: 0, enviou: false, votou: false, meme: "", imgIndice: 0 }];
            abrirTelaLobby();
        });
        peer.on('connection', (conn) => {
            conexoes.push(conn);
            conn.on('data', (data) => lidarComDadosHost(data, conn));
            setTimeout(() => { sincronizarTodosOsClientes({ tipo: "lista_lobby", lista: jugadores }); }, 500);
        });
    };

    document.getElementById('btnEntrar').onclick = () => {
        tocarSom(sfxClique); ligarMusica();
        meuNome = document.getElementById('inputNome').value.trim().replace(/['"]/g, '');
        codigoSala = document.getElementById('inputCodigo').value.trim().toUpperCase();
        if(!meuNome || !codigoSala) return alert("Preencha Nome e Código!");
        modoJogo = "cliente"; peer = new Peer();
        peer.on('open', () => {
            let conn = peer.connect(codigoSala); conexoes = [conn];
            conn.on('open', () => {
                conn.send({ tipo: "entrar", nome: meuNome });
                abrirTelaLobby();
            });
            conn.on('data', (data) => lidarComDadosCliente(data));
        });
    };

    function abrirTelaLobby() {
        telaInicial.classList.add('hidden'); telaLobby.classList.remove('hidden');
        document.getElementById('lobby-codigo').innerText = codigoSala;
        if(modoJogo === "host") {
            document.getElementById('btnIniciarJogo').classList.remove('hidden');
            document.getElementById('lobby-msg-cliente').innerText = "";
        } else {
            document.getElementById('btnIniciarJogo').classList.add('hidden');
            document.getElementById('lobby-msg-cliente').innerText = "Aguardando o Dono da Sala iniciar a partida...";
        }
        atualizarLobbyInterface();
    }

    function atualizarLobbyInterface() {
        const listaDiv = document.getElementById('lobby-lista-jogadores');
        listaDiv.innerHTML = "<strong style='color:#8257e5;'>Jogadores na sala:</strong><br>";
        jogadores.forEach((j, i) => { listaDiv.innerHTML += `<div style='padding: 5px 0;'>👤 ${j.nome} ${i === 0 ? "👑 (Host)" : ""}</div>`; });
    }

    document.getElementById('btnIniciarJogo').onclick = () => {
        tocarSom(sfxClique);
        prepararSacoDeImagens();
        jogadores.forEach(j => {
            j.enviou = false; j.votou = false; j.meme = "";
            if(imagensDisponiveisRodada.length === 0) prepararSacoDeImagens();
            j.imgIndice = imagensDisponiveisRodada.pop();
        });
        sincronizarTodosOsClientes({ tipo: "começar_jogo", lista: jugadores });
    };

    function abrirTelaJogo() {
        telaLobby.classList.add('hidden'); telaVotacao.classList.add('hidden'); telaRanking.classList.add('hidden'); telaJogo.classList.remove('hidden');
        document.getElementById('info-sala').innerText = "Sala: " + codigoSala;
        document.getElementById('status-envio').innerText = "";
        atualizarListaInterface();
    }

    function lidarComDadosHost(data, conn) {
        if (data.tipo === "entrar") {
            if(!jogadores.find(p => p.id === conn.peer)) {
                jogadores.push({ id: conn.peer, nome: data.nome, pontos: 0, enviou: false, votou: false, meme: "", imgIndice: 0 });
            }
            sincronizarTodosOsClientes({ tipo: "lista_lobby", lista: jugadores });
        }
        if (data.tipo === "submeter_meme") {
            let j = jogadores.find(p => p.id === conn.peer); if(j) { j.enviou = true; j.meme = data.imagem; }
            atualizarListaInterface();
            if (jogadores.every(p => p.enviou)) {
                clearInterval(intervaloTimer);
                sincronizarTodosOsClientes({ tipo: "ir_votacao", listaMemes: jogadores.map(p => ({id: p.id, nome: p.nome, imagem: p.meme})) });
            }
        }
        if (data.tipo === "voto") {
            let j = jogadores.find(p => p.id === data.idVotado); if(j) j.pontos += 10;
            let ele = jogadores.find(p => p.id === conn.peer); if(ele) ele.votou = true;
            if (jogadores.every(p => p.votou)) sincronizarTodosOsClientes({ tipo: "ir_ranking", listaRanking: jugadores });
        }
    }

    function lidarComDadosCliente(data) {
        if (data.tipo === "lista_lobby") { jogadores = data.lista; atualizarLobbyInterface(); }
        if (data.tipo === "começar_jogo") {
            jogadores = data.lista;
            let meuDados = jogadores.find(p => p.id === peer.id);
            if(meuDados && meuDados.imgIndice !== undefined) configurarNovaImagem(meuDados.imgIndice);
            abrirTelaJogo(); iniciarTemporizador();
        }
        if (data.tipo === "ir_votacao") { clearInterval(intervaloTimer); montarTelaVotacao(data.listaMemes); }
        if (data.tipo === "ir_ranking") montarTelaRanking(data.listaRanking);
    }

    function sincronizarTodosOsClientes(objeto) {
        lidarComDadosCliente(objeto);
        conexoes.forEach(c => { if(c.open) c.send(objeto); });
    }

    function atualizarListaInterface() {
        document.getElementById('lista-jogadores').innerText = "Na sala: " + jogadores.map(j => j.nome + (j.enviou ? " (Pronto)" : "")).join(", ");
    }

    document.getElementById('btnEnviar').onclick = () => { tocarSom(sfxClique); enviarMemeManual(); };

    function enviarMemeManual() {
        if(jaEnviouMeme) return; jaEnviouMeme = true;
        const imgFinal = canvas.toDataURL('image/jpeg', 0.4);
        document.getElementById('status-envio').innerText = "Meme enviado! Aguardando o grupo...";
        if (modoJogo === "host") {
            let j = jogadores.find(p => p.id === peer.id); if(j) { j.enviou = true; j.meme = imgFinal; }
            atualizarListaInterface();
            if (jogadores.every(p => p.enviou)) {
                clearInterval(intervaloTimer);
                sincronizarTodosOsClientes({ tipo: "ir_votacao", listaMemes: jogadores.map(p => ({id: p.id, nome: p.nome, imagem: p.meme})) });
            }
        } else { conexoes[0].send({ tipo: "submeter_meme", imagem: imgFinal }); }
    }

    function enviarMemeForçado() { document.getElementById('temporizador').innerText = "⏱️ Tempo Esgotado!"; enviarMemeManual(); }

    function montarTelaVotacao(listaMemes) {
        telaJogo.classList.add('hidden'); telaVotacao.classList.remove('hidden');
        const galeria = document.getElementById('galeria-memes'); galeria.innerHTML = "";
        listaMemes.forEach(m => {
            if(!m.imagem) return;
            const card = document.createElement('div'); card.className = "meme-card";
            const img = document.createElement('img'); img.src = m.imagem;
            const btnVoto = document.createElement('button'); btnVoto.className = "btn btn-vote"; btnVoto.innerText = "👍 Votar (Por " + m.nome + ")";
            if(m.id === peer.id) { btnVoto.disabled = true; btnVoto.innerText = "Seu Meme"; btnVoto.style.background = "#323238"; }
            btnVoto.onclick = () => {
                tocarSom(sfxVoto); // Efeito sonoro de votação realizado com sucesso
                if(modoJogo === "host") {
                    let j = jogadores.find(p => p.id === m.id); if(j) j.pontos += 10;
                    let ele = jogadores.find(p => p.id === peer.id); if(ele) ele.votou = true;
                    if (jogadores.every(p => p.votou)) sincronizarTodosOsClientes({ tipo: "ir_ranking", listaRanking: jugadores });
                } else { conexoes[0].send({ tipo: "voto", idVotado: m.id }); }
                galeria.innerHTML = "<h3>Voto enviado! Aguardando o resto do grupo...</h3>";
            };
            card.appendChild(img); card.appendChild(btnVoto); galeria.appendChild(card);
        });
    }

    function montarTelaRanking(listaRanking) {
        tocarSom(sfxVitoria); // Toca o alarme/som de fim de partida / vitória
        telaVotacao.classList.add('hidden'); telaRanking.classList.remove('hidden');
        const podio = document.getElementById('podio-scores'); podio.innerHTML = "";
        let ordenada = [...listaRanking].sort((a, b) => b.pontos - a.pontos);
        ordenada.forEach((j, idx) => {
            const item = document.createElement('div'); item.className = "ranking-item";
            item.innerHTML = `<span>#${idx+1} ${j.nome}</span> <span>${j.pontos} pts</span>`;
            podio.appendChild(item);
        });
    }

    document.getElementById('btnVoltarJogo').onclick = () => {
        tocarSom(sfxClique);
        if(modoJogo === "host") {
            prepararSacoDeImagens();
            jogadores.forEach(j => { j.enviou = false; j.votou = false; j.meme = ""; if(imagensDisponiveisRodada.length === 0) prepararSacoDeImagens(); j.imgIndice = imagensDisponiveisRodada.pop(); });
            sincronizarTodosOsClientes({ tipo: "começar_jogo", lista: jogadores });
        }
    };

    function drawMeme() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.width = currentImage.width || 400; canvas.height = currentImage.height || 300;
        ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
        const fSize = Math.floor(canvas.width * 0.075);
        ctx.font = `bold ${fSize}px Impact, Arial Black`; ctx.fillStyle = 'white'; ctx.strokeStyle = 'black'; ctx.lineWidth = fSize / 5; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        textosMeme.forEach(t => { ctx.strokeText(t.conteudo.toUpperCase(), t.x, t.y); ctx.fillText(t.conteudo.toUpperCase(), t.x, t.y); });
    }
</script>
