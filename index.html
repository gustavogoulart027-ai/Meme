<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make It Meme - Versão Estável</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #fff; text-align: center; padding: 15px; margin: 0; -webkit-user-select: none; user-select: none; }
        .container { max-width: 500px; margin: 0 auto; background: #202024; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        .btn { background: #8257e5; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 10px 0; width: 100%; font-size: 16px; display: block; box-sizing: border-box; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #323238 !important; color: #7c7c8a !important; cursor: not-allowed; }
        input[type="text"], textarea { padding: 12px; width: 100%; border-radius: 6px; border: none; margin: 8px 0; background: #121214; color: #fff; border: 1px solid #323238; font-size: 15px; box-sizing: border-box; }
        #canvas-container { position: relative; display: inline-block; max-width: 100%; margin-top: 10px; }
        canvas { max-width: 100%; border-radius: 8px; border: 2px solid #8257e5; background: #121214; touch-action: none; display: block; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #8257e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>Make It Meme 🎭</h1>
    
    <div id="tela-inicial">
        <input type="text" id="inputNome" placeholder="Seu Nome / Apelido"><br>
        <button class="btn" id="btnCriar">Criar Nova Sala</button>
        <input type="text" id="inputCodigo" placeholder="Código da Sala"><br>
        <button class="btn" id="btnEntrar" style="background: #29292e;">Entrar na Sala</button>
    </div>

    <div id="tela-lobby" class="hidden">
        <h1 id="lobby-codigo" style="color: #feb72b;">-</h1>
        <div id="lobby-lista-jogadores" style="text-align: left; margin-bottom: 20px;"></div>
        <button class="btn hidden" id="btnIniciarJogo" style="background: #04d361;">🚀 Iniciar Jogo</button>
    </div>

    <div id="tela-jogo" class="hidden">
        <div id="temporizador">⏱️ Tempo: 04:00</div>
        <canvas id="memeCanvas"></canvas>
        <button class="btn" id="btnEnviar" style="background:#04d361;">🚀 Enviar</button>
    </div>

    <div id="tela-espera" class="hidden"><h2>Meme Enviado!</h2><div class="loader"></div></div>
    <div id="tela-exposicao" class="hidden"><h3 id="autor-meme">Meme de: -</h3><img id="img-exposicao" style="width:100%"></div>
    <div id="tela-votacao" class="hidden"><h2>Vote no Melhor!</h2><div id="galeria"></div></div>
    <div id="tela-ranking" class="hidden"><h2>🏆 Ranking</h2><div id="podio"></div><button class="btn hidden" id="btnVoltar">Próxima Rodada</button></div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
    let peer, conexoes = [], jogadores = [], filaMemes = [], modoJogo = "host";
    const memeImages = ["meme1.jpg", "meme2.jpg", "meme3.jpg", "meme4.jpg", "meme5.jpg"];
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 400; canvas.height = 360;

    function resetarFila() {
        filaMemes = [...Array(memeImages.length).keys()].sort(() => Math.random() - 0.5);
    }

    document.getElementById('btnCriar').onclick = () => {
        const nome = document.getElementById('inputNome').value;
        if(!nome) return alert("Nome?");
        const codigo = "MIM-" + Math.random().toString(36).substring(2, 7).toUpperCase();
        peer = new Peer(codigo);
        peer.on('open', () => {
            jogadores = [{ id: peer.id, nome, pontos: 0, enviou: false, meme: "", imgIndice: 0 }];
            resetarFila();
            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-lobby').classList.remove('hidden');
            document.getElementById('lobby-codigo').innerText = codigo;
            document.getElementById('btnIniciarJogo').classList.remove('hidden');
        });
        peer.on('connection', (conn) => {
            conexoes.push(conn);
            conn.on('data', (data) => {
                if(data.tipo === "entrar") {
                    jogadores.push({ id: conn.peer, nome: data.nome, pontos: 0, enviou: false, meme: "", imgIndice: 0 });
                    conexoes.forEach(c => c.send({tipo: "lista", lista: jogadores}));
                }
                if(data.tipo === "submeter") {
                    let j = jogadores.find(p => p.id === conn.peer);
                    j.enviou = true; j.meme = data.imagem;
                    if(jogadores.every(p => p.enviou)) iniciarExposicao();
                }
            });
        });
    };

    document.getElementById('btnIniciarJogo').onclick = () => {
        if(filaMemes.length < jogadores.length) resetarFila();
        jogadores.forEach(j => {
            j.enviou = false; j.meme = "";
            j.imgIndice = filaMemes.shift();
        });
        conexoes.forEach(c => c.send({tipo: "inicio", lista: jogadores}));
        iniciarTelaJogo(jogadores.find(p => p.id === peer.id).imgIndice);
    };

    function iniciarTelaJogo(indice) {
        document.getElementById('tela-lobby').classList.add('hidden');
        document.getElementById('tela-jogo').classList.remove('hidden');
        // Lógica de desenho e timer aqui...
    }

    function iniciarExposicao() {
        // Lógica de exibição sequencial aqui...
    }

    // Nota: A lógica de PeerJS é assíncrona. 
    // Garanta que todos os clientes recebam a lista atualizada de jogadores antes do início.
</script>
</body>
</html>
