<script>
    let audioCtx = null, musicLoopStarted = false, estaMutado = false; 
    let textosMeme = []; 
    let peer = null, conexoes = [], modoJogo = "host", meuNome = "", codigoSala = "", jogadores = [];
    let tempoRestante = 240, intervaloTimer = null, jaEnviouMeme = false;
    let imagemMemeAtual = new Image(), imagemCarregada = false, indiceImagemAtualGlobal = 0; 
    let textoArrastando = null, timerExposicaoLoop = null; 
    let idCampeaoAnterior = "", idSabotadoAtual = "";
    let redeDesligadaBloqueio = false;
    
    let configPartida = { tempo: 240, rodadasMax: 3, rodadaAtual: 1, trocasMax: 3 };
    let trocasRealizadasPeloUsuario = 0;

    const hashChaveMestra = "3c1bb0df627df2fbf2ebf8db71f1bf434914107e034947d19dfbdfecfc40e830";
    const listaCoresPaleta = ['#000000', '#0000FF', '#FF0000', '#FFFF00', '#00FF00', '#FFFFFF'];

    // CORREÇÃO: Lógica do botão mutar/desmutar som e imagens corrigida
    document.getElementById('btnMudo').onclick = (e) => {
        e.stopPropagation(); 
        estaMutado = !estaMutado;
        document.getElementById('btnMudo').innerText = estaMutado ? "❌" : "🔊";
        
        if (!estaMutado) {
            iniciarContextoAudio();
            if (!musicLoopStarted) {
                musicLoopStarted = true;
                ligarMusicaAmbienteVirtual();
            }
        }
    };

    document.getElementById('btnSecreto').onclick = () => {
        document.getElementById('senhaAdmin').value = "";
        document.getElementById('areaLoginAdmin').classList.remove('hidden');
        document.getElementById('areaAcoesAdmin').classList.add('hidden');
        document.getElementById('modalAdmin').classList.remove('hidden');
    };

    document.getElementById('btnFecharAdmin').onclick = () => {
        document.getElementById('modalAdmin').classList.add('hidden');
    };

    document.getElementById('btnAutenticarAdmin').onclick = async () => {
        const textoDigitado = document.getElementById('senhaAdmin').value;
        const msgBuffer = new TextEncoder().encode(textoDigitado);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        if (hashHex === hashChaveMestra) {
            document.getElementById('areaLoginAdmin').classList.add('hidden');
            document.getElementById('areaAcoesAdmin').classList.remove('hidden');
            
            // Atualiza o texto do botão com base no estado atual da rede
            const btnDesligar = document.getElementById('btnDesligarSalas');
            if (redeDesligadaBloqueio) {
                btnDesligar.innerText = "🟩 LIGAR REDE DE SALAS";
                btnDesligar.style.background = "#00ff00";
                btnDesligar.style.color = "#000";
            } else {
                btnDesligar.innerText = "🚨 DESLIGAR TODAS AS SALAS";
                btnDesligar.style.background = "#ef4444";
                btnDesligar.style.color = "#fff";
            }
        } else {
            document.getElementById('modalAdmin').classList.add('hidden');
        }
    };

    // CORREÇÃO: Botão de Ligar e Desligar Salas de forma Global/Local
    document.getElementById('btnDesligarSalas').onclick = () => {
        if (!redeDesligadaBloqueio) {
            // Ação de DESLIGAR
            redeDesligadaBloqueio = true;
            document.getElementById('modalAdmin').classList.add('hidden');
            
            // Ejeta todos os jogadores se você for o Host antes de fechar tudo
            sincronizarTodosOsClientes({ tipo: "ejecao_admin" });
            
            setTimeout(() => {
                voltarParaTelaInicial();
                alert("Comando executado: Sistema de salas desativado globalmente.");
            }, 500);
        } else {
            // Ação de LIGAR
            redeDesligadaBloqueio = false;
            document.getElementById('modalAdmin').classList.add('hidden');
            alert("Sistema de salas reativado com sucesso!");
        }
    };

    function iniciarContextoAudio() {
        try {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            if (!musicLoopStarted && !estaMutado) { musicLoopStarted = true; ligarMusicaAmbienteVirtual(); }
        } catch(e) {}
    }

    function ligarMusicaAmbienteVirtual() {
        let acordesSunday = [[261.63, 329.63, 392.00, 493.88], [261.63, 311.13, 392.00, 466.16], [293.66, 349.23, 440.00, 523.25], [392.00, 493.88, 587.33, 698.46]];
        let passo = 0;
        setInterval(() => {
            if (!audioCtx || audioCtx.state === 'suspended' || estaMutado) return;
            try {
                let notasAtuais = acordesSunday[passo % acordesSunday.length];
                let tempoAtual = audioCtx.currentTime;
                notasAtuais.forEach((frequencia, index) => {
                    let osc = audioCtx.createOscillator(); let g = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(frequencia, tempoAtual + (index * 0.12)); 
                    g.gain.setValueAtTime(0.05, tempoAtual + (index * 0.12));
                    g.gain.exponentialRampToValueAtTime(0.001, tempoAtual + 1.2);
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.start(tempoAtual + (index * 0.12)); osc.stop(tempoAtual + 1.2);
                });
                passo++;
            } catch(e){}
        }, 1600); 
    }

    function tocarSomNativo(tipo) {
        try {
            if (estaMutado) return;
            iniciarContextoAudio();
            if (!audioCtx || audioCtx.state === 'suspended') return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            let tempoAtual = audioCtx.currentTime;
            if (tipo === 'clique') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, tempoAtual);
                osc.frequency.exponentialRampToValueAtTime(150, tempoAtual + 0.08);
                gain.gain.setValueAtTime(0.3, tempoAtual); gain.gain.linearRampToValueAtTime(0.01, tempoAtual + 0.08);
                osc.start(tempoAtual); osc.stop(tempoAtual + 0.08);
            } else if (tipo === 'voto') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(587.33, tempoAtual);
                osc.frequency.setValueAtTime(783.99, tempoAtual + 0.1);
                gain.gain.setValueAtTime(0.3, tempoAtual); gain.gain.linearRampToValueAtTime(0.01, tempoAtual + 0.2);
                osc.start(tempoAtual); osc.stop(tempoAtual + 0.2);
            } else if (tipo === 'vitoria') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, tempoAtual);
                osc.frequency.setValueAtTime(659.25, tempoAtual + 0.1); osc.frequency.setValueAtTime(783.99, tempoAtual + 0.2);
                gain.gain.setValueAtTime(0.3, tempoAtual); gain.gain.linearRampToValueAtTime(0.01, tempoAtual + 0.4);
                osc.start(tempoAtual); osc.stop(tempoAtual + 0.4);
            }
        } catch(e) {}
    }

    const telaInicial = document.getElementById('tela-inicial');
    const telaLobby = document.getElementById('tela-lobby');
    const telaJogo = document.getElementById('tela-jogo');
    const telaEspera = document.getElementById('tela-espera');
    const telaExposicao = document.getElementById('tela-exposicao');
    const telaVotacao = document.getElementById('tela-votacao');
    const telaRanking = document.getElementById('tela-ranking');
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 400; canvas.height = 360;

    document.addEventListener('click', iniciarContextoAudio);
    document.addEventListener('touchstart', iniciarContextoAudio);

    const memeImages = [
        "meme33.jpg", "meme.jpg", "meme17.jpg", "meme2.jpg", "meme8.jpg", 
        "meme3.jpg", "meme9.jpg", "meme4.jpg", "meme5.jpg", "meme18.jpg", 
        "meme6.jpg", "meme12.jpg", "meme10.jpg", "meme34.jpg", "meme13.jpg", 
        "meme15.jpg", "meme14.jpg", "meme11.jpg", "Meme16.jpg", "meme7.jpg", 
        "meme32.jpg", "meme30.jpg", "meme31.jpg", "meme19.jpg", "meme20.jpg", 
        "meme21.jpg", "meme22.jpg", "meme27.jpg", "meme23.jpg", "meme29.jpg", 
        "meme28.jpg", "meme26.jpg", "meme24.jpg", "meme25.jpg", "meme35.jpg", "meme36.jpg", "meme37.jpg", "meme38.jpg", "meme39.jpg", "meme40.jpg",
    ];
    
    function gerarFundoMemeVirtual(indice) {
        imagemCarregada = false;
        indiceImagemAtualGlobal = indice;
        let urlSelecionada = memeImages[indice % memeImages.length];
        
        imagemMemeAtual = new Image();
        imagemMemeAtual.crossOrigin = "anonymous";
        
        let imgTimeout = setTimeout(() => { imagemCarregada = true; }, 3500);
        imagemMemeAtual.onload = () => { clearTimeout(imgTimeout); imagemCarregada = true; };
        imagemMemeAtual.onerror = () => { clearTimeout(imgTimeout); imagemCarregada = true; };
        imagemMemeAtual.src = urlSelecionada;

        if (textosMeme.length === 0) {
            textosMeme = [
                { conteudo: "TEXTO SUPERIOR", x: canvas.width / 2, y: 50, tamanho: 30, rotacao: 0, cor: '#FFFFFF' },
                { conteudo: "TEXTO INFERIOR", x: canvas.width / 2, y: canvas.height - 60, tamanho: 30, rotacao: 0, cor: '#FFFFFF' }
            ];
        }
        inicializarInputs();
    }

    document.getElementById('btnTrocarMeme').onclick = () => {
        tocarSomNativo('clique');
        if (trocasRealizadasPeloUsuario >= configPartida.trocasMax) {
            alert("Você atingiu o limite máximo de trocas de meme para esta rodada!");
            return;
        }
        trocasRealizadasPeloUsuario++;
        atualizarTrocasInterface();
        let novoIndice = Math.floor(Math.random() * memeImages.length);
        if(novoIndice === indiceImagemAtualGlobal) novoIndice = (novoIndice + 1) % memeImages.length;
        gerarFundoMemeVirtual(novoIndice);
    };

    function atualizarTrocasInterface() {
        let elemento = document.getElementById('contador-trocas-ui');
        if (configPartida.trocasMax > 100) {
            elemento.innerText = "🎲 Trocas restantes: Ilimitadas";
        } else {
            elemento.innerText = `🎲 Trocas restantes: ${configPartida.trocasMax - trocasRealizadasPeloUsuario}`;
        }
    }

    function renderLoop() { drawMeme(); requestAnimationFrame(renderLoop); }
    requestAnimationFrame(renderLoop);

    function iniciarTemporizador() {
        clearInterval(intervaloTimer);
        
        if(idSabotadoAtual === peer.id) {
            tempoRestante = Math.floor(configPartida.tempo / 2); 
            document.getElementById('alerta-sabotado').classList.remove('hidden');
            document.querySelector('.container').classList.add('sabotagem-alerta');
        } else {
            tempoRestante = configPartida.tempo; 
            document.getElementById('alerta-sabotado').classList.add('hidden');
            document.querySelector('.container').classList.remove('sabotagem-alerta');
        }

        document.getElementById('btnEnviar').disabled = false;
        document.getElementById('temporizador').style.color = "#fff";
        
        intervaloTimer = setInterval(() => {
            tempoRestante--;
            let minutes = Math.floor(tempoRestante / 60); let segundos = tempoRestante % 60;
            document.getElementById('temporizador').innerText = `⏱️ Tempo: ${minutes.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            if (tempoRestante <= 15) document.getElementById('temporizador').style.color = "#ef4444";
            if (tempoRestante <= 0) { clearInterval(intervaloTimer); if (!jaEnviouMeme) enviarMemeForçado(); }
        }, 1000);
    }

    function inicializarInputs() {
        const container = document.getElementById('container-inputs');
        container.innerHTML = "";
        textosMeme.forEach((t, index) => {
            const bloco = document.createElement('div'); bloco.className = "bloco-legenda";
            
            const txt = document.createElement('textarea'); txt.value = t.conteudo;
            txt.placeholder = "Texto do meme...";
            txt.oninput = (e) => { t.conteudo = e.target.value; };
            
            const controles = document.createElement('div'); controles.className = "controles-legenda";

            const btnMenos = document.createElement('button'); btnMenos.className = "btn-size"; btnMenos.innerText = "A-";
            btnMenos.onclick = () => { t.tamanho = Math.max(12, (t.tamanho || 30) - 3); };
            
            const btnMais = document.createElement('button'); btnMais.className = "btn-size"; btnMais.innerText = "A+";
            btnMais.onclick = () => { t.tamanho = Math.min(60, (t.tamanho || 30) + 3); };

            const btnGirarEsq = document.createElement('button'); btnGirarEsq.className = "btn-size"; btnGirarEsq.innerText = "↺";
            btnGirarEsq.onclick = () => { t.rotacao = ((t.rotacao || 0) - 15) % 360; };

            const btnGirarDir = document.createElement('button'); btnGirarDir.className = "btn-size"; btnGirarDir.innerText = "↻";
            btnGirarDir.onclick = () => { t.rotacao = ((t.rotacao || 0) + 15) % 360; };

            const btnApagar = document.createElement('button'); btnApagar.innerText = "X";
            btnApagar.style = "background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;";
            btnApagar.onclick = () => { textosMeme.splice(index, 1); inicializarInputs(); };
            
            controles.appendChild(btnMenos); controles.appendChild(btnMais); controles.appendChild(btnGirarEsq); controles.appendChild(btnGirarDir);
            if(textosMeme.length > 1) controles.appendChild(btnApagar);
            
            const tabelaCores = document.createElement('div'); tabelaCores.className = "tabela-cores";
            const tabularCores = document.createElement('div'); tabularCores.className = "linha-cores";
            
            listaCoresPaleta.forEach(cor => {
                const celula = document.createElement('div');
                celula.className = "celula-cor";
                celula.style.backgroundColor = cor;
                if(t.cor === cor) celula.classList.add('ativa');
                
                celula.onclick = () => {
                    tocarSomNativo('clique');
                    t.cor = cor;
                    bloco.querySelectorAll('.celula-cor').forEach(c => c.classList.remove('ativa'));
                    celula.classList.add('ativa');
                };
                tabularCores.appendChild(celula);
            });
            tabelaCores.appendChild(tabularCores);

            bloco.appendChild(txt);
            bloco.appendChild(controles);
            bloco.appendChild(tabelaCores);
            container.appendChild(bloco);
        });
    }

    document.getElementById('btnAdicionarTexto').onclick = () => {
        textosMeme.push({ conteudo: "NOVO TEXTO", x: canvas.width / 2, y: canvas.height / 2, tamanho: 28, rotations: 0, cor: '#FFFFFF' });
        inicializarInputs();
    };

    function obterPosicao(e) {
        const rect = canvas.getBoundingClientRect();
        const clienteX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clienteY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        if (clienteX === undefined || clienteY === undefined) return {x: 0, y: 0};
        return { x: ((clienteX - rect.left) / rect.width) * canvas.width, y: ((clienteY - rect.top) / rect.height) * canvas.height };
    }

    function iniciarArrasto(e) {
        const pos = obterPosicao(e);
        textoArrastando = textosMeme.find(t => Math.sqrt(Math.pow(pos.x - t.x, 2) + Math.pow(pos.y - t.y, 2)) < 50);
    }

    function movendoArrasto(e) {
        if (!textoArrastando) return;
        if(e.cancelable) e.preventDefault();
        const pos = obterPosicao(e);
        if (pos.x === 0 && pos.y === 0) return;
        textoArrastando.x = pos.x; textoArrastando.y = pos.y;
    }

    canvas.addEventListener('mousedown', iniciarArrasto); canvas.addEventListener('mousemove', movendoArrasto); window.addEventListener('mouseup', () => textoArrastando = null);
    canvas.addEventListener('touchstart', iniciarArrasto, { passive: false }); canvas.addEventListener('touchmove', movendoArrasto, { passive: false }); window.addEventListener('touchend', () => textoArrastando = null);

    document.getElementById('btnDownload').onclick = () => {
        tocarSomNativo('clique');
        const link = document.createElement('a'); link.download = 'meme-' + Math.floor(Math.random() * 10000) + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.8); link.click();
    };

    document.getElementById('btnCriar').onclick = () => {
        if(redeDesligadaBloqueio) return alert("As salas do site encontram-se temporariamente desativadas pela gerência.");
        tocarSomNativo('clique');
        meuNome = document.getElementById('inputNome').value.trim().replace(/['"{}()\[\]]/g, '');
        if(!meuNome) return alert("Digite seu nome!");
        
        document.getElementById('lobby-codigo').innerText = "CRIANDO...";
        desconectarComSeguranca();
        
        modoJogo = "host"; 
        let idGerada = Math.random().toString(36).substring(2, 7).toUpperCase();
        codigoSala = "MIM-" + idGerada;
        
        peer = new Peer(codigoSala); 
        
        peer.on('open', (id) => {
            document.getElementById('lobby-codigo').innerText = id;
            document.getElementById('painel-config-host').classList.remove('hidden');
            document.getElementById('btnIniciarJogo').style.display = 'block';
            
            jogadores = [{ 
                id: peer.id, nome: meuNome, pontos: 0, enviou: false, votou: false, meme: "", imgIndice: 0,
                imagensRestantes: Array.from({length: memeImages.length}, (_, i) => i)
            }];
            abrirTelaLobby();
        });

        peer.on('connection', (conn) => {
            if(redeDesligadaBloqueio) { conn.close(); return; }
            let idxExistente = conexoes.findIndex(c => c.peer === conn.peer);
            if(idxExistente !== -1) { conexoes[idxExistente] = conn; } else { conexoes.push(conn); }
            
            conn.on('data', (data) => lidarComDadosHost(data, conn));
            setTimeout(() => { 
                sincronizarTodosOsClientes({ 
                    tipo: "lista_lobby", lista: jogadores, campeao: idCampeaoAnterior, config: configPartida 
                }); 
            }, 600);
        });

        peer.on('error', (err) => {
            alert("Erro na rede ou sala ocupada. Clique em Criar Sala de novo.");
            document.getElementById('lobby-codigo').innerText = "ERRO";
        });
    };

    document.getElementById('btnEntrar').onclick = () => {
        if(redeDesligadaBloqueio) return alert("As salas do site encontram-se temporariamente desativadas pela gerência.");
        tocarSomNativo('clique');
        meuNome = document.getElementById('inputNome').value.trim().replace(/['"{}()\[\]]/g, '');
        let sufixoCodigo = document.getElementById('inputCodigo').value.trim().toUpperCase();
        if(!meuNome || !sufixoCodigo) return alert("Preencha seu nome e o código!");
        
        let codigoLimpo = sufixoCodigo.replace("MIM-", "").replace(/[^A-Z0-9]/gi, '');
        codigoSala = "MIM-" + codigoLimpo; 
        
        document.getElementById('lobby-codigo').innerText = "CONECTANDO...";
        desconectarComSeguranca();
        modoJogo = "cliente"; 
        peer = new Peer();
        
        peer.on('open', () => {
            let conn = peer.connect(codigoSala); 
            conexoes = [conn];
            
            conn.on('open', () => {
                document.getElementById('lobby-codigo').innerText = codigoSala;
                document.getElementById('painel-config-host').classList.add('hidden');
                document.getElementById('btnIniciarJogo').style.display = 'none';
                conn.send({ tipo: "enter_request", nome: meuNome });
                abrirTelaLobby();
            });
            conn.on('data', (data) => lidarComDadosCliente(data));
        });
        
        peer.on('error', (err) => {
            alert("Sala não encontrada! Digite apenas as letras após o MIM-");
            voltarParaTelaInicial();
        });
    };

    function abrirTelaLobby() {
        telaInicial.classList.add('hidden'); telaJogo.classList.add('hidden'); telaVotacao.classList.add('hidden'); telaRanking.classList.add('hidden'); telaEspera.classList.add('hidden'); telaExposicao.classList.add('hidden');
        telaLobby.classList.remove('hidden');
        atualizarLobbyInterface();
    }

    function atualizarLobbyInterface() {
        const listaDiv = document.getElementById('lobby-lista-jogadores');
        listaDiv.innerHTML = "<strong style='color:#fff;'>Participantes:</strong><br>";
        
        const selectV = document.getElementById('selectVitima');
        selectV.innerHTML = '<option value="">-- Não sabotar ninguém --</option>';
        
        jogadores.forEach((j, i) => { 
            let sufixo = j.id.includes("MIM-") && i === 0 ? " <span>(LÍDER)</span>" : "";
            if(j.id === idCampeaoAnterior) sufixo += " 👑 [Carrasco]";
            listaDiv.innerHTML += `<div style='padding: 6px 0; border-bottom: 1px solid #222;'>👤 ${j.nome}${sufixo}</div>`; 
            if (j.id !== idCampeaoAnterior) selectV.innerHTML += `<option value="${j.id}">${j.nome}</option>`;
        });

        if(peer && peer.id === idCampeaoAnterior && jogadores.length > 1) {
            document.getElementById('painel-campeao-sabotagem').classList.remove('hidden');
        } else {
            document.getElementById('painel-campeao-sabotagem').classList.add('hidden');
        }
    }

    document.getElementById('btnIniciarJogo').onclick = () => { 
        tocarSomNativo('clique'); 
        configPartida.tempo = parseInt(document.getElementById('configTempo').value);
        configPartida.rodadasMax = parseInt(document.getElementById('configRodadas').value);
        configPartida.trocasMax = parseInt(document.getElementById('configTrocas').value);
        
        if(peer.id === idCampeaoAnterior) { idSabotadoAtual = document.getElementById('selectVitima').value; }
        configPartida.rodadaAtual = 1;
        jogadores.forEach(j => j.pontos = 0);
        iniciarNovaRodadaLógica(); 
    };

    function iniciarNovaRodadaLógica() {
        if(timerExposicaoLoop) clearInterval(timerExposicaoLoop);
        let indicesEscolhidosNestaRodada = [];
        trocasRealizadasPeloUsuario = 0;
        textosMeme = [];
        
        jogadores.forEach(j => {
            j.enviou = false; j.votou = false; j.meme = "";
            if (!j.imagensRestantes || j.imagensRestantes.length === 0) { j.imagensRestantes = Array.from({length: memeImages.length}, (_, i) => i); }
        });
        
        jogadores.forEach(j => {
            let opcoesValidas = j.imagensRestantes.filter(idx => !indicesEscolhidosNestaRodada.includes(idx));
            if (opcoesValidas.length === 0) { opcoesValidas = j.imagensRestantes; }
            let indiceSorteado = opcoesValidas[Math.floor(Math.random() * opcoesValidas.length)];
            if(indiceSorteado === undefined) { indiceSorteado = Math.floor(Math.random() * memeImages.length); }
            
            j.imgIndice = indiceSorteado;
            j.imagensRestantes = j.imagensRestantes.filter(idx => idx !== indiceSorteado);
            indicesEscolhidosNestaRodada.push(indiceSorteado);
        });
        
        sincronizarTodosOsClientes({ tipo: "começar_jogo", lista: jogadores, sabotado: idSabotadoAtual, config: configPartida });
    }

    function abrirTelaJogo() {
        telaLobby.classList.add('hidden'); telaVotacao.classList.add('hidden'); telaRanking.classList.add('hidden'); telaEspera.classList.add('hidden'); telaExposicao.classList.add('hidden'); telaJogo.classList.remove('hidden');
        atualizarTrocasInterface();
        atualizarListaInterface();
    }

    function lidarComDadosHost(data, conn) {
        if (data.tipo === "enter_request") {
            if(!jogadores.find(p => p.id === conn.peer)) {
                jogadores.push({ id: conn.peer, nome: data.nome, pontos: 0, enviou: false, votou: false, meme: "", imgIndice: 0, imagensRestantes: Array.from({length: memeImages.length}, (_, i) => i) });
            }
            sincronizarTodosOsClientes({ tipo: "lista_lobby", lista: jogadores, campeao: idCampeaoAnterior, config: configPartida });
        }
        if (data.tipo === "definir_sabotagem") { idSabotadoAtual = data.idVitima; }
        if (data.tipo === "submeter_meme") {
            let j = jogadores.find(p => p.id === conn.peer); 
            if(j) { j.enviou = true; j.meme = data.imagem; }
            sincronizarTodosOsClientes({ tipo: "atualizar_envios_status", lista: jogadores });
            verificarTerminoDeEnvios();
        }
        if (data.tipo === "cancelar_meme") {
            let j = jogadores.find(p => p.id === conn.peer);
            if(j) { j.enviou = false; j.meme = ""; }
            sincronizarTodosOsClientes({ tipo: "atualizar_envios_status", lista: jogadores });
        }
        if (data.tipo === "voto") {
            let ele = jogadores.find(p => p.id === conn.peer);
            if(ele && !ele.votou) {
                ele.votou = true;
                let jVotado = jogadores.find(p => p.id === data.idVotado); if(jVotado) jVotado.pontos += 10;
            }
            if (jogadores.every(p => p.votou)) {finalizarFaseDeVotacaoLógica();}
        }
    }

    function verificarTerminoDeEnvios() {
        if (jogadores.every(p => p.enviou)) {
            clearInterval(intervaloTimer);
            ejecutarSequenciaExposicaoMeme(jogadores.map(p => ({id: p.id, nome: p.nome, imagem: p.meme})));
        }
    }

    function finalizarFaseDeVotacaoLógica() {
        let ordenada = [...jogadores].sort((a, b) => b.pontos - a.pontos);
        idCampeaoAnterior = ordenada[0] ? ordenada[0].id : "";
        sincronizarTodosOsClientes({ tipo: "ir_ranking", listaRanking: jogadores, campeao: idCampeaoAnterior, config: configPartida });
    }

    function lidarComDadosCliente(data) {
        if (data.tipo === "lista_lobby") { jogadores = data.lista; idCampeaoAnterior = data.campeao || ""; configPartida = data.config; atualizarLobbyInterface(); }
        if (data.tipo === "começar_jogo") {
            jaEnviouMeme = false; jogadores = data.lista; idSabotadoAtual = data.sabotado || ""; configPartida = data.config;
            let meuDados = jogadores.find(p => p.id === peer.id);
            if(meuDados && meuDados.imgIndice !== undefined) gerarFundoMemeVirtual(meuDados.imgIndice);
            abrirTelaJogo(); iniciarTemporizador();
        }
        if (data.tipo === "atualizar_envios_status") {
            jogadores = data.lista;
            atualizarListaInterface();
        }
        if (data.tipo === "mostrar_meme_individual") abrirTelaExposicaoDinamica(data.nomeAutor, data.imagemMeme, data.segundosRestantes);
        if (data.tipo === "ir_votacao") montarTelaVotacao(data.listaMemes);
        if (data.tipo === "ir_ranking") { idCampeaoAnterior = data.campeao || ""; configPartida = data.config; montarTelaRanking(data.listaRanking); }
        
        // Trata a ejeção global disparada pelo admin
        if (data.tipo === "ejecao_admin") { 
            voltarParaTelaInicial(); 
            alert("Você foi ejetado da partida: O administrador finalizou as salas da rede."); 
        }
    }

    function sincronizarTodosOsClientes(objeto) {
        lidarComDadosCliente(objeto);
        conexoes.forEach(c => { if(c.open) c.send(objeto); });
    }

    function atualizarListaInterface() {
        let faltando = jogadores.filter(j => !j.enviou).map(j => j.nome);
        let textoFaltando = faltando.length > 0 ? faltando.join(", ") : "Ninguém! Processando...";
        
        document.getElementById('lista-falta-jogo').innerText = textoFaltando;
        document.getElementById('lista-falta-espera').innerText = textoFaltando;
    }

    document.getElementById('selectVitima').onchange = (e) => {
        if(modoJogo === "cliente" && conexoes[0] && conexoes[0].open) { conexoes[0].send({ tipo: "definir_sabotagem", idVitima: e.target.value }); } 
        else { idSabotadoAtual = e.target.value; }
    };

    document.getElementById('btnEnviar').onclick = () => { tocarSomNativo('clique'); enviarMemeManual(); };

    function enviarMemeManual() {
        if(jaEnviouMeme) return; jaEnviouMeme = true;
        document.getElementById('btnEnviar').disabled = true;
        const imgFinal = canvas.toDataURL('image/jpeg', 0.5);
        
        telaJogo.classList.add('hidden'); 
        telaEspera.classList.remove('hidden');
        document.querySelector('.container').classList.remove('sabotagem-alerta');
        
        if (modoJogo === "host") {
            let j = jogadores.find(p => p.id === peer.id); if(j) { j.enviou = true; j.meme = imgFinal; }
            sincronizarTodosOsClientes({ tipo: "atualizar_envios_status", lista: jogadores });
            verificarTerminoDeEnvios();
        } else { if (conexoes[0] && conexoes[0].open) { conexoes[0].send({ tipo: "submeter_meme", imagem: imgFinal }); } }
    }

    function enviarMemeForçado() { enviarMemeManual(); }

    document.getElementById('btnCancelarEnvio').onclick = () => {
        tocarSomNativo('clique');
        jaEnviouMeme = false;
        document.getElementById('btnEnviar').disabled = false;
        telaEspera.classList.add('hidden');
        telaJogo.classList.remove('hidden');
        
        if (modoJogo === "host") {
            let j = jogadores.find(p => p.id === peer.id); if(j) { j.enviou = false; j.meme = ""; }
            sincronizarTodosOsClientes({ tipo: "atualizar_envios_status", lista: jogadores });
        } else { if (conexoes[0] && conexoes[0].open) { conexoes[0].send({ tipo: "cancelar_meme" }); } }
    };

    function ejecutarSequenciaExposicaoMeme(listaMemes) {
        if(timerExposicaoLoop) clearInterval(timerExposicaoLoop);
        let indiceMeme = 0; let tempoRestanteExposicao = 10; 
        
        function apresentarProximoMeme() {
            if(timerExposicaoLoop) clearInterval(timerExposicaoLoop);
            while(indiceMeme < listaMemes.length && !listaMemes[indiceMeme].imagem) { indiceMeme++; }
            if (indiceMeme >= listaMemes.length) { sincronizarTodosOsClientes({ tipo: "ir_votacao", listaMemes: listaMemes }); return; }
            
            let memeAtual = listaMemes[indiceMeme]; tempoRestanteExposicao = 10; 
            sincronizarTodosOsClientes({ tipo: "mostrar_meme_individual", nomeAutor: memeAtual.nome, imagemMeme: memeAtual.imagem, segundosRestantes: tempoRestanteExposicao });
            
            timerExposicaoLoop = setInterval(() => {
                tempoRestanteExposicao--;
                if (tempoRestanteExposicao <= 0) { clearInterval(timerExposicaoLoop); indiceMeme++; apresentarProximoMeme(); } 
                else { sincronizarTodosOsClientes({ tipo: "mostrar_meme_individual", nomeAutor: memeAtual.nome, imagemMeme: memeAtual.imagem, segundosRestantes: tempoRestanteExposicao }); }
            }, 1000);
        }
        apresentarProximoMeme();
    }

    function abrirTelaExposicaoDinamica(nome, imagem, segundos) {
        telaJogo.classList.add('hidden'); telaEspera.classList.add('hidden'); telaVotacao.classList.add('hidden'); telaExposicao.classList.remove('hidden');
        document.getElementById('autor-meme-exposto').innerText = "Meme de: " + nome;
        document.getElementById('img-meme-exposto').src = imagem;
        document.getElementById('timer-exposicao').innerText = `👀 Olhem para a tela: ${segundos}s`;
    }

    function montarTelaVotacao(listaMemes) {
        telaExposicao.classList.add('hidden'); telaEspera.classList.add('hidden'); telaVotacao.classList.remove('hidden');
        const galeria = document.getElementById('galeria-memes'); galeria.innerHTML = "";
        listaMemes.forEach(m => {
            if(!m.imagem) return;
            const card = document.createElement('div'); card.className = "meme-card";
            const img = document.createElement('img'); img.src = m.imagem;
            const btnVoto = document.createElement('button'); btnVoto.className = "btn btn-vote"; btnVoto.innerText = "👍 Votar em " + m.nome;
            if(m.id === peer.id) { btnVoto.disabled = true; btnVoto.innerText = "Seu Meme"; btnVoto.style = "background:#222; color:#555; border:none; box-shadow:none;"; }
            
            btnVoto.onclick = () => {
                tocarSomNativo('voto'); btnVoto.disabled = true; 
                if(modoJogo === "host") {
                    let ele = jogadores.find(p => p.id === peer.id);
                    if(ele && !ele.votou) { ele.votou = true; let j = jogadores.find(p => p.id === m.id); if(j) j.pontos += 10; }
                    if (jogadores.every(p => p.votou)) { finalizarFaseDeVotacaoLógica(); }
                } else { if (conexoes[0] && conexoes[0].open) { conexoes[0].send({ tipo: "voto", idVotado: m.id }); } }
                galeria.innerHTML = "<h3>Voto Computado! Aguardando o resto...</h3><div class='loader'></div>";
            };
            card.appendChild(img); card.appendChild(btnVoto); galeria.appendChild(card);
        });
    }

    function montarTelaRanking(listaRanking) {
        tocarSomNativo('vitoria');
        telaVotacao.classList.add('hidden'); telaRanking.classList.remove('hidden');
        document.getElementById('titulo-rodada-ranking').innerText = `🏆 Rodada ${configPartida.rodadaAtual} de ${configPartida.rodadasMax} 🏆`;
        
        const podio = document.getElementById('podio-scores'); podio.innerHTML = "";
        let ordenada = [...listaRanking].sort((a, b) => b.pontos - a.pontos);
        
        ordenada.forEach((j, idx) => {
            const item = document.createElement('div'); item.className = "ranking-item";
            let coroa = idx === 0 ? "👑 " : "";
            item.innerHTML = `<span>#${idx+1} ${coroa}${j.nome}</span> <span>${j.pontos} pts</span>`;
            podio.appendChild(item);
        });
        
        if(modoJogo === "host") {
            const btnVoltar = document.getElementById('btnVoltarJogo');
            btnVoltar.classList.remove('hidden');
            if (configPartida.rodadaAtual >= configPartida.rodadasMax) {
                btnVoltar.innerText = "🔄 Reiniciar Nova Partida";
            } else {
                btnVoltar.innerText = "Avançar Próxima Rodada";
            }
        } else { document.getElementById('btnVoltarJogo').classList.add('hidden'); }
    }

    document.getElementById('btnVoltarJogo').onclick = () => { 
        tocarSomNativo('clique'); 
        if(modoJogo !== "host") return;
        if (configPartida.rodadaAtual >= configPartida.rodadasMax) {
            configPartida.rodadaAtual = 1; jogadores.forEach(j => j.pontos = 0);
        } else { configPartida.rodadaAtual++; }
        iniciarNovaRodadaLógica(); 
    };

    function desconectarComSeguranca() {
        if(intervaloTimer) clearInterval(intervaloTimer);
        if(timerExposicaoLoop) clearInterval(timerExposicaoLoop);
        conexoes.forEach(c => { try{c.close();}catch(e){} }); conexoes = [];
        if(peer) { try{peer.destroy();}catch(e){} peer = null; }
    }

    function voltarParaTelaInicial() {
        desconectarComSeguranca();
        telaLobby.classList.add('hidden'); telaJogo.classList.add('hidden'); telaEspera.classList.add('hidden'); telaExposicao.classList.add('hidden'); telaVotacao.classList.add('hidden'); telaRanking.classList.add('hidden');
        telaInicial.classList.remove('hidden');
    }

    document.getElementById('btnSairLobby').onclick = () => { tocarSomNativo('clique'); voltarParaTelaInicial(); };
    document.getElementById('btnSairGame').onclick = () => { tocarSomNativo('clique'); voltarParaTelaInicial(); };

    function drawMeme() {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (imagemCarregada && imagemMemeAtual.complete && imagemMemeAtual.naturalWidth > 0) { ctx.drawImage(imagemMemeAtual, 0, 0, canvas.width, canvas.height); } 
        else {
            ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff"; ctx.font = "14px sans-serif"; ctx.textAlign = "center"; ctx.fillText("[Carregando Imagem...]", canvas.width / 2, canvas.height / 2);
        }
        if(textosMeme && textosMeme.length > 0) {
            textosMeme.forEach(t => { 
                ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(((t.rotacao || 0) * Math.PI) / 180);
                ctx.strokeStyle = 'black'; ctx.fillStyle = t.cor || '#FFFFFF'; 
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                let tamFonte = t.tamanho || 30;
                ctx.font = `bold ${tamFonte}px Impact, Arial Black, sans-serif`;
                ctx.lineWidth = tamFonte / 4; 

                let linhas = (t.conteudo || "").toUpperCase().split('\n');
                let alturaLinha = tamFonte * 1.2;
                let offsetTotal = ((linhas.length - 1) * alturaLinha) / 2;

                linhas.forEach((linha, i) => {
                    let posY = (i * alturaLinha) - offsetTotal;
                    ctx.strokeText(linha, 0, posY); ctx.fillText(linha, 0, posY); 
                });
                ctx.restore();
            });
        }
    }
</script>
